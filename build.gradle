// Legacy project layout is retained to keep the source tree and resource paths intact.
plugins { id 'com.android.application' version '8.10.1' }

android {
    namespace 'de.androvdr'
    compileSdk 36

    defaultConfig {
        applicationId 'de.androvdr'
        minSdk 14
        targetSdk 34
        versionCode 27
        versionName '1.8'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures { buildConfig false }
    lint { abortOnError false }
}

dependencies {
    // Keep the original support-v4 API for the existing fragment and ViewPager code.
    implementation 'com.android.support:support-v4:28.0.0'
    implementation 'com.github.mwiede:jsch:0.2.21'
    implementation 'com.jcraft:jzlib:1.1.3'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'org.slf4j:slf4j-android:1.7.36'
    implementation 'org.hampelratte:svdrp4j:1.2.1'
}
